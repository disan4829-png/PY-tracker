<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PY — Binance Perpetual Contracts</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#16171a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PY">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f6f5f2;
    --card: #ffffff;
    --card-border: #ebe9e4;
    --ink: #16171a;
    --sub: #8b8a86;
    --green: #0f9d58;
    --green-bg: #e8f7ef;
    --red: #d13b3b;
    --red-bg: #fbebeb;
    --accent: #16171a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:28px 18px 90px;
  }
  .brand{
    text-align:center;
    margin-bottom:6px;
  }
  .brand h1{
    font-size:40px;
    font-weight:800;
    letter-spacing:-0.03em;
    margin:0;
  }
  .brand p{
    margin:4px 0 0;
    color:var(--sub);
    font-size:14px;
    font-weight:500;
  }
  .controls{
    display:flex;
    gap:8px;
    margin:22px 0 16px;
  }
  .search{
    flex:1;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:12px;
    padding:11px 14px;
    font-family:'Inter';
    font-size:14px;
    color:var(--ink);
  }
  .search:focus{outline:none;border-color:#c9c7c0;}
  .sortbtn{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:12px;
    padding:0 14px;
    font-family:'Inter';
    font-size:13px;
    font-weight:600;
    color:var(--sub);
    cursor:pointer;
  }
  .sortbtn.active{ color:var(--ink); border-color:#c9c7c0; }
  .status-line{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12px;
    color:var(--sub);
    margin-bottom:14px;
    padding:0 2px;
  }
  .dot{
    display:inline-block;
    width:7px;height:7px;
    border-radius:50%;
    background:var(--green);
    margin-right:6px;
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse{
    0%{opacity:1;} 50%{opacity:.35;} 100%{opacity:1;}
  }
  .list{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:18px;
    padding:20px 20px 18px;
    transition: box-shadow .25s ease, border-color .25s ease;
  }
  .card.flash{
    border-color: var(--ink);
    box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
  }
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }
  .symbol{
    font-size:14px;
    font-weight:700;
    letter-spacing:0.02em;
    color:#3a3a38;
  }
  .symbol .quote{
    color:var(--sub);
    font-weight:600;
  }
  .bell{
    width:20px;height:20px;
    color: var(--sub);
    flex-shrink:0;
  }
  .bell.armed{ color: var(--ink); }
  .price{
    font-family:'Roboto Mono', monospace;
    font-weight:700;
    font-size:30px;
    letter-spacing:-0.02em;
    margin:10px 0 6px;
    font-variant-numeric: tabular-nums;
  }
  .change-row{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:14px;
    font-weight:700;
  }
  .change-row.up{ color:var(--green); }
  .change-row.down{ color:var(--red); }
  .change-row .period{
    color:var(--sub);
    font-weight:500;
  }
  .ref-note{
    font-size:11px;
    color:var(--sub);
    margin-top:8px;
    font-weight:500;
  }
  .footer{
    position:fixed;
    bottom:0; left:0; right:0;
    background:linear-gradient(to top, var(--bg) 60%, transparent);
    padding:24px 0 18px;
    text-align:center;
  }
  .footer-pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--ink);
    color:#fff;
    font-size:12px;
    font-weight:600;
    padding:9px 16px;
    border-radius:999px;
    letter-spacing:0.02em;
  }
  .footer-pill .dot2{
    width:6px;height:6px;border-radius:50%;
    background:#4ade80;
  }
  .empty{
    text-align:center;
    color:var(--sub);
    padding:60px 20px;
    font-size:14px;
  }
  /* toast alerts */
  .toast-wrap{
    position:fixed;
    top:16px; left:0; right:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    pointer-events:none;
    z-index:50;
  }
  .toast{
    pointer-events:auto;
    width:min(420px, 92vw);
    background:var(--ink);
    color:#fff;
    border-radius:14px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
    animation: slidein .25s ease;
  }
  @keyframes slidein{
    from{ transform:translateY(-14px); opacity:0; }
    to{ transform:translateY(0); opacity:1; }
  }
  .toast.up{ background:var(--green); }
  .toast.down{ background:var(--red); }
  .toast-text b{ font-size:15px; }
  .toast-text span{ display:block; font-size:12px; opacity:0.85; margin-top:2px; }
  .toast-close{
    background:rgba(255,255,255,0.18);
    border:none;
    color:#fff;
    width:26px;height:26px;
    border-radius:50%;
    font-size:14px;
    cursor:pointer;
    flex-shrink:0;
  }
  .loading{
    text-align:center;
    color:var(--sub);
    padding:50px 0;
    font-size:14px;
  }
  .skeleton-card{
    height:118px;
    border-radius:18px;
    background:linear-gradient(90deg, var(--card) 25%, #f0efeb 37%, var(--card) 63%);
    background-size:400% 100%;
    animation: shimmer 1.4s ease infinite;
    border:1px solid var(--card-border);
  }
  @keyframes shimmer{
    0%{ background-position:100% 50%; }
    100%{ background-position:0 50%; }
  }
</style>
</head>
<body>

<div class="toast-wrap" id="toastWrap"></div>

<div class="app">
  <div class="brand">
    <h1>PY</h1>
    <p>Binance Perpetual Contracts</p>
    <button id="installBtn" style="display:none; margin-top:14px; background:var(--ink); color:#fff; border:none; border-radius:999px; padding:9px 18px; font-family:'Inter'; font-size:13px; font-weight:600; cursor:pointer;">
      Install PY
    </button>
  </div>

  <div class="controls">
    <input class="search" id="searchBox" placeholder="Search symbol, e.g. SOL" />
    <button class="sortbtn active" id="sortMover">Movers</button>
    <button class="sortbtn" id="sortAZ">A–Z</button>
  </div>

  <div class="status-line">
    <span><span class="dot"></span><span id="countLabel">Loading symbols…</span></span>
    <span id="thresholdLabel">Alert at ±10%</span>
  </div>

  <div class="list" id="list">
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
  </div>
</div>

<div class="footer">
  <div class="footer-pill"><span class="dot2"></span><span id="footerStatus">Live • Alerts ON</span></div>
</div>

<script>
const THRESHOLD = 10.0;
const POLL_MS = 5000;
const SYMBOL_REFRESH_MS = 10 * 60 * 1000;

let symbols = [];          // array of symbol strings
let priceData = {};        // symbol -> { price, changePct24h, ref }
let sortMode = 'movers';
let searchTerm = '';
let armed = {};             // symbol -> bool (alert armed)

const listEl = document.getElementById('list');
const countLabel = document.getElementById('countLabel');
const toastWrap = document.getElementById('toastWrap');
const searchBox = document.getElementById('searchBox');
const sortMoverBtn = document.getElementById('sortMover');
const sortAZBtn = document.getElementById('sortAZ');

searchBox.addEventListener('input', e => {
  searchTerm = e.target.value.trim().toUpperCase();
  render();
});
sortMoverBtn.addEventListener('click', () => { sortMode='movers'; sortMoverBtn.classList.add('active'); sortAZBtn.classList.remove('active'); render(); });
sortAZBtn.addEventListener('click', () => { sortMode='az'; sortAZBtn.classList.add('active'); sortMoverBtn.classList.remove('active'); render(); });

async function fetchSymbolList(){
  const res = await fetch('https://fapi.binance.com/fapi/v1/exchangeInfo');
  const data = await res.json();
  return data.symbols
    .filter(s => s.status === 'TRADING' && s.contractType === 'PERPETUAL' && s.quoteAsset === 'USDT')
    .map(s => s.symbol);
}

async function fetch24hTickers(){
  // 24hr ticker gives price + priceChangePercent in one call
  const res = await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr');
  const data = await res.json();
  const map = {};
  data.forEach(item => {
    map[item.symbol] = {
      price: parseFloat(item.lastPrice),
      changePct24h: parseFloat(item.priceChangePercent)
    };
  });
  return map;
}

function formatPrice(p){
  if(p >= 1000) return p.toLocaleString(undefined, {maximumFractionDigits:2, minimumFractionDigits:2});
  if(p >= 1) return p.toLocaleString(undefined, {maximumFractionDigits:4});
  return p.toPrecision(4);
}

function showToast(symbol, direction, changePct, ref, current){
  const el = document.createElement('div');
  el.className = 'toast ' + (direction === 'RISE' ? 'up' : 'down');
  const arrow = direction === 'RISE' ? '↗' : '↘';
  el.innerHTML = `
    <div class="toast-text">
      <b>${arrow} ${symbol.replace('USDT','/USDT')} ${direction}</b>
      <span>${changePct > 0 ? '+' : ''}${changePct.toFixed(2)}% from ${formatPrice(ref)} → ${formatPrice(current)}</span>
    </div>
    <button class="toast-close">✕</button>
  `;
  el.querySelector('.toast-close').onclick = () => el.remove();
  toastWrap.appendChild(el);
  setTimeout(() => { if(el.parentNode) el.remove(); }, 12000);

  const card = document.getElementById('card-' + symbol);
  if(card){
    card.classList.add('flash');
    setTimeout(() => card.classList.remove('flash'), 1500);
  }
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = direction === 'RISE' ? 880 : 440;
    gain.gain.setValueAtTime(0.06, ctx.currentTime);
    osc.start(); osc.stop(ctx.currentTime + 0.15);
  }catch(e){}
}

function render(){
  let syms = symbols.filter(s => priceData[s]);
  if(searchTerm){
    syms = syms.filter(s => s.includes(searchTerm));
  }
  if(sortMode === 'movers'){
    syms.sort((a,b) => Math.abs(priceData[b].changePct24h) - Math.abs(priceData[a].changePct24h));
  } else {
    syms.sort();
  }
  syms = syms.slice(0, 60); // keep DOM light; search narrows further

  countLabel.textContent = `${symbols.length} pairs tracked`;

  if(syms.length === 0){
    listEl.innerHTML = '<div class="empty">No matching symbols</div>';
    return;
  }

  listEl.innerHTML = syms.map(sym => {
    const d = priceData[sym];
    const up = d.changePct24h >= 0;
    const base = sym.replace('USDT','');
    return `
      <div class="card" id="card-${sym}">
        <div class="card-top">
          <div class="symbol">${base}<span class="quote">/USDT PERP</span></div>
          <svg class="bell armed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </div>
        <div class="price">$${formatPrice(d.price)}</div>
        <div class="change-row ${up ? 'up':'down'}">
          <span>${up ? '↗' : '↘'} ${up ? '+' : ''}${d.changePct24h.toFixed(2)}%</span>
          <span class="period">· 24h</span>
        </div>
      </div>
    `;
  }).join('');
}

async function pollLoop(){
  try{
    const tickers = await fetch24hTickers();
    for(const sym of symbols){
      if(!tickers[sym]) continue;
      const current = tickers[sym].price;
      if(!priceData[sym]){
        priceData[sym] = { price: current, changePct24h: tickers[sym].changePct24h, ref: current };
        continue;
      }
      const prev = priceData[sym];
      const ref = prev.ref;
      const changeFromRef = ((current - ref) / ref) * 100;

      priceData[sym] = { price: current, changePct24h: tickers[sym].changePct24h, ref: ref };

      if(Math.abs(changeFromRef) >= THRESHOLD){
        const direction = changeFromRef > 0 ? 'RISE' : 'FALL';
        showToast(sym, direction, changeFromRef, ref, current);
        priceData[sym].ref = current; // reset reference after alert
      }
    }
    render();
  }catch(e){
    console.error('Poll error', e);
    countLabel.textContent = 'Connection error — retrying…';
  }
}

async function refreshSymbols(){
  try{
    const list = await fetchSymbolList();
    symbols = list;
  }catch(e){
    console.error('Symbol list error', e);
  }
}

async function init(){
  await refreshSymbols();
  await pollLoop();
  setInterval(pollLoop, POLL_MS);
  setInterval(refreshSymbols, SYMBOL_REFRESH_MS);
}

init();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed', err));
  });
}

let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById('installBtn');
  if (btn) btn.style.display = 'inline-flex';
});

document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('installBtn');
  if (btn) {
    btn.addEventListener('click', async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      btn.style.display = 'none';
    });
  }
});
</script>
</body>
</html>
